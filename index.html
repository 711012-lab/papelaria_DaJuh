<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum Copa 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Copa 2026</h1>

        <div class="cabecalho-acoes">
            <div class="campo-pesquisa">
                <input type="text" id="pesquisa-input" placeholder="Buscar jogador">
            </div>
        </div>

        <div class="carrinho">
           🛒 <span id="carrinho-count">0</span>
        </div>

        <nav>
            <ul>
                <li><a href="#">Galeria</a></li>
                <li><a href="#">Minha Coleção</a></li>
                <li><a href="#">Sobre</a></li>
            </ul>
        </nav>
    </header>

     <main>
        <h2>itens</h2>
        <div class="container-pai">
            <!-- Card 1 -->
            <div class="card">
                <div class="cabecalho-card">
                    <span class="nome">Canetas de anime</span>
                    <span class="numero">5un</span>
                </div>
                <img src="img/vini.webp" alt="Imagem do jogador Vinícius Jr.">
                <p class="descricao">cores variadas</p>
            
                <div class="card-botoes"> 
                    <button class="botao-adicionar"> Adicionar ao Carrinho </button>
                    <button class="botao-detalhes"> Vizualizar Detalhe </button>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="card">
                <div class="cabecalho-card">
                    <span class="nome">borrachas</span>
                    <span class="numero">1un</span>
                </div>
                <img src="img/neymar.jpg" alt="Imagem do jogador Neymar Jr.">
                <p class="descricao">borrachas calvas</p>
                            
                <div class="card-botoes"> 
                    <button class="botao-adicionar"> Adicionar ao Carrinho </button>
                    <button class="botao-detalhes"> Vizualizar Detalhe </button>
                </div>
            </div>

             <!-- Card 3 -->
            <div class="card">
                <div class="cabecalho-card">
                    <span class="nome">caderno</span>
                    <span class="numero">2un </span>
                </div>
                <img src="img/desconhecido.png" alt="Imagem do jogador.">
                <p class="descricao">kit caderno</p>
                            
                <div class="card-botoes"> 
                    <button class="botao-adicionar"> Adicionar ao Carrinho </button>
                    <button class="botao-detalhes"> Vizualizar Detalhe </button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; materiais de papelaria.</p>
    </footer>

</body>
</html>
